services:
  ocq-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    container_name: ocq-gateway
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      OCQ_GATEWAY_HOST: 0.0.0.0
      OCQ_GATEWAY_PORT: 3034
      OPENCODE_SERVER_URL: http://127.0.0.1:4096
      OCQ_ENV_FILE: /run/secrets/opencode-server.env
      OCQ_DEFAULT_DIRECTORY: /home/onnwee
      OCQ_MODEL_ALIASES: openai/gpt-4.1-mini=openai/gpt-5.4-mini,gpt-4.1-mini=openai/gpt-5.4-mini
    network_mode: host
    volumes:
      - ./opencode-server.env:/run/secrets/opencode-server.env:ro

  ocq-ui:
    build:
      context: ..
      dockerfile: apps/ui/Dockerfile
    container_name: ocq-ui
    restart: unless-stopped
    ports:
      - "3033:80"
